<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cancel a home visit</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/app.css">
<script src="/powered.js"></script>
<style>
  /* Opened by a patient or a relative from a text: large type, plain words, one decision. */
  body.cx { font-size: 18px; background: var(--bg) }
  .cx-top { padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--surface) }
  .cx-top b { display: block; font: 600 26px/1.1 var(--f-display); min-height: 29px }
  .cx-main { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px }
  .cx-main h1 { font-size: clamp(30px, 6vw, 42px); line-height: 1.05; margin: 6px 0 12px }
  .cx-card { background: var(--surface); border-radius: 18px; padding: 22px; box-shadow: inset 0 0 0 1.5px var(--line); margin-top: 18px }
  .cx-card dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 0 }
  .cx-card dt { color: var(--muted) }
  .cx-card dd { margin: 0; font-weight: 600 }
  .cx .input { font-size: 18px; padding: 13px 15px; width: 100% }
  .cx .btn.lg { font-size: 19px; padding: 16px 22px; width: 100%; justify-content: center; margin-top: 18px }
  .cx .q { display: grid; gap: 6px; margin-top: 18px; font-weight: 600 }
  .cx .done { box-shadow: inset 0 0 0 2px var(--ok) }
</style>
</head>
<body class="cx">
<header class="cx-top"><b id="practice"></b></header>
<main class="cx-main" id="root" aria-live="polite"><p class="muted">Loading…</p></main>
<script>
(function () {
"use strict";
const [, , code, token] = location.pathname.split("/");
const root = document.getElementById("root");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let INFO = null;
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json", "X-Domi": "1" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({ error: "Something went wrong. Please call us instead." }));
  if (!r.ok) throw new Error(d.error || "Something went wrong. Please call us instead.");
  return d;
}
const call = () => INFO && INFO.brand && INFO.brand.phone ? ` on <a href="tel:${esc(INFO.brand.phone.replace(/\s/g, ""))}">${esc(INFO.brand.phone)}</a>` : "";
const visit = (v) => `<div class="cx-card"><dl><dt>For</dt><dd>${esc(v.patient)}</dd><dt>When</dt><dd>${esc(v.when.charAt(0).toUpperCase() + v.when.slice(1))}</dd><dt>Visit</dt><dd>${esc(v.visit)}</dd><dt>With</dt><dd>${esc(v.clinician)}</dd></dl></div>`;
function render(err) {
  const v = INFO;
  if (v.state === "cancelled") { root.innerHTML = `<div class="caps">Home visit</div><h1>This visit is cancelled</h1>${visit(v)}<p class="muted" style="margin-top:18px">We'll be in touch to arrange another time. To rebook sooner, call us${call()}.</p>`; return; }
  if (v.state !== "booked") { root.innerHTML = `<div class="caps">Home visit</div><h1>It's too late to cancel online</h1>${visit(v)}<p class="muted" style="margin-top:18px">${esc(v.clinician)} is already on the way or has been. Please call us${call()}.</p>`; return; }
  root.innerHTML = `<div class="caps">Home visit</div><h1>Cancel this visit?</h1>
    <p class="muted" style="margin:0">If the visit can't go ahead, cancel it here and we'll offer the time to someone who's waiting.</p>
    ${visit(v)}
    <label class="q">Why can't it go ahead?<select class="input" id="reason">${v.reasons.map((r) => `<option>${esc(r)}</option>`).join("")}</select></label>
    ${err ? `<div class="err" role="alert" style="margin-top:16px">${esc(err)}</div>` : ""}
    <button class="btn danger lg" type="button" id="go">Cancel the visit</button>
    <p class="muted" style="font-size:15px;margin-top:14px">Want a different time instead? Call us${call()} and we'll move it.</p>`;
  document.getElementById("go").onclick = async (e) => {
    e.target.disabled = true;
    try {
      await api("POST", `/api/public/${encodeURIComponent(code)}/visit/${encodeURIComponent(token)}/cancel`, { reason: document.getElementById("reason").value });
      root.innerHTML = `<div class="cx-card done"><div class="caps">Cancelled</div><h1 style="margin-top:8px">Thank you for letting us know</h1><p class="muted" style="margin:0">The visit ${esc(v.when)} is cancelled. We'll be in touch to arrange another time.</p></div>`;
      window.scrollTo(0, 0);
    } catch (err) { render(err.message); }
  };
}
api("GET", `/api/public/${encodeURIComponent(code || "")}/visit/${encodeURIComponent(token || "")}`).then((info) => {
  INFO = info;
  const b = info.brand, top = document.getElementById("practice");
  if (b && b.theme) document.documentElement.dataset.brand = b.id;
  if (b && b.logo) { top.innerHTML = `<img src="${esc(b.logo)}" alt="${esc(info.practice)}" referrerpolicy="no-referrer" style="height:52px;width:auto;display:block">`; top.querySelector("img").addEventListener("error", () => { top.textContent = info.practice; }, { once: true }); }
  else top.textContent = info.practice;
  window.DomiPowered(b);
  document.title = "Cancel a home visit · " + info.practice;
  render();
}).catch((e) => { root.innerHTML = `<h1>This link isn't working</h1><p class="muted">${esc(e.message)}</p>`; });
})();
</script>
</body>
</html>
