# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Everything below is applied automatically.
services:
  - type: web
    name: domi-hearing-demo
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to the UK
    buildCommand: npm test     # no packages to install; a failing test stops a bad deploy
    startCommand: npm start
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"            # latest 22.x; start script passes --experimental-sqlite for older 22 releases
      - key: OFFER_MINUTES
        value: "20"
      - key: ROUTING_PROVIDER
        value: osrm            # live road routes for new postcodes; falls back to estimates if unreachable
