# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Everything below is applied automatically.
services:
  - type: web
    name: domi-hearing-demo
    runtime: node
    plan: free
    region: frankfurt          # closest Render region to the UK
    buildCommand: npm test     # no packages to install; a failing test stops a bad deploy
    startCommand: npm start
    healthCheckPath: /api/meta
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0         # node:sqlite needs 22.5+
      - key: SESSION_SECRET
        generateValue: true
      - key: OFFER_MINUTES
        value: "20"
