# Fly.io, London: the live service for real practices. Deploy with: fly launch --copy-config --no-deploy, then fly deploy.
# Secrets (never in this file): fly secrets set DATABASE_URL=... DATABASE_CA_CERT="$(cat prod-ca-2021.crt)" TWILIO_ACCOUNT_SID=... TWILIO_AUTH_TOKEN=... TWILIO_FROM=...
# Each practice is held in memory and saved to Supabase as it changes, so run exactly one machine: fly scale count 1
app = "domi-live"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = 10         # seconds to finish saving to Postgres before the machine is stopped (server/index.js)

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "0"            # no sample practices, no demo shortcuts, no demo password
  DEFAULT_BRAND = "hvo"      # the practice's look on the sign-in page
  PRACTICE_CODE = "HVO"      # the practice people sign in to
  ROUTING_PROVIDER = "ors"   # openrouteservice; needs the ORS_API_KEY secret, estimates without it
  OFFER_MINUTES = "20"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off" # stays awake: reminders, recalls and offer replies run on timers
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/meta"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
